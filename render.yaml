# Render Blueprint for the KMIDS Hackathon 2027 staff portal.
#
# To use it: push this file, then create a new Blueprint at
# https://dashboard.render.com/blueprints and point it at this repository.
# Render reads the service below and asks you for every value marked
# `sync: false` before the first deploy.
#
# The README describes deploying to Vercel; this is the same app on Render.
# Nothing here is Render-specific inside the code — the portal is a stock
# Next.js server, so `next build` / `next start` is all it needs.

services:
  - type: web
    name: kmids-hackathon-portal
    runtime: node
    # Bangkok is closer to Singapore than to any other Render region.
    region: singapore
    plan: starter
    # No `branch:` — Render tracks the repository's default branch, whatever
    # it is named. Set it explicitly if you want deploys from another branch.
    buildCommand: npm ci && npm run build
    # `next start` binds to $PORT, which Render sets for us.
    startCommand: npm run start

    # /api/health/db answers 200 only once the service can actually reach
    # Aurora, which is exactly what "healthy" means now that the portal has no
    # other database. A deploy with the wrong endpoint or a closed security
    # group fails here instead of serving error pages.
    healthCheckPath: /api/health/db

    autoDeploy: true

    envVars:
      # Next 15 and React 19 need a modern Node. Match this to whatever you
      # develop against.
      - key: NODE_VERSION
        value: "22"

      # ---------------------------------------------------------------------
      # Aurora PostgreSQL. The portal has no other database, so the service
      # cannot start serving without these.
      #
      # Render has no OIDC exchange with AWS, so the IAM-token path the README
      # describes for Vercel is not available here: authenticate with a
      # password, and keep the cluster reachable from Render's egress IPs.
      # ---------------------------------------------------------------------
      - key: RDS_HOSTNAME
        sync: false
      - key: RDS_PORT
        value: "5432"
      - key: RDS_DATABASE
        sync: false
      - key: RDS_USERNAME
        sync: false
      - key: RDS_PASSWORD
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1

      # Or, instead of the six above, the whole connection as one URI:
      # - key: AURORA_DATABASE_URL
      #   sync: false

      # ---------------------------------------------------------------------
      # Uploaded files. An S3 bucket, reached with a plain access key since
      # there is no role to assume from here.
      # ---------------------------------------------------------------------
      - key: FILES_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ---------------------------------------------------------------------
      # Owner bootstrap. Two Owners always exist so that one graduating
      # student is never a single point of failure.
      # ---------------------------------------------------------------------
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_BACKUP_EMAIL
        sync: false

      # Anyone with an address at this domain may sign in; everyone else needs
      # an explicit invite from an Owner.
      - key: SCHOOL_EMAIL_DOMAIN
        value: kmids.ac.th
